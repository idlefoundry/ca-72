format = 1
name = "Pressure Solo"
description = "A sawtooth and a square at 8', gliding, with a vibrato that rises in after each note starts (an LFO on TUNE, RISE about a second). Pressure, a note's own (MPE) or the keyboard's, opens the filter up to an octave and a half; MPE's slide (timbre) adds a noisy growl through the mod wheel. An expressive solo lead."
tags = ["lead", "expressive", "glide", "lfo"]

