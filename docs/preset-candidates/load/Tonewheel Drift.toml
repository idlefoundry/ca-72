format = 1
name = "Tonewheel Drift"
description = "Triangles at 16', 8' and 4' with a click of contour, POLY's eight voices: a soft drawbar organ. Three LFOs turn it as a rotating speaker turns (the level, the filter and the width); MACRO 1 (ROTOR) spins them up from slow to fast, gliding as a rotor does; MACRO 2 (PERC) adds a percussive bite."
tags = ["organ", "keys", "poly", "lfo", "macros"]
macro_names = ["ROTOR", "PERC"]

