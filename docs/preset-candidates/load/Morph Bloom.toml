format = 1
name = "Morph Bloom"
description = "Two CONTINUOUS waveforms between shark tooth and sawtooth, each voice's own LFOs turning them, and a 4' triangle above: a slow pad for four macros. MACRO 1 (BRIGHT) opens the filter and the 4'; MACRO 2 (DRIFT) pulls the voices apart; MACRO 3 (MOTION) fades in a slow filter sweep; MACRO 4 (FAST) shortens the swells. All four start at nothing."
tags = ["pad", "poly", "slow", "lfo", "macros"]
macro_names = ["BRIGHT", "DRIFT", "MOTION", "FAST"]

