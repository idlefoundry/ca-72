format = 1
name = "Tempo Wobble"
description = "Sawtooth, square and a 32' triangle sub, driven 10 dB, with two timed LFOs on the filter: MACRO 1 (WOB 8) fades in an eighth-note wobble, set most of the way up, and MACRO 2 (WOB 16) a sixteenth-note one, so the two can be crossfaded as it plays; MACRO 3 (GROWL) adds emphasis and drive. Both restart on every note."
tags = ["bass", "wobble", "lfo", "macros"]
macro_names = ["WOB 8", "WOB 16", "GROWL"]

