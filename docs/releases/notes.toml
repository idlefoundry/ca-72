# The bundled highlights, condensed from the matching Markdown files in this folder.
# On-screen text uses American spelling. Keep all three lists, even when empty.
# See docs/whats-new.md when preparing a release.

[[release]]
version = "0.2.3"
features = [
  "Play without a DAW in the standalone application. Open AUDIO & MIDI in Settings to choose your audio and MIDI devices.",
  "The keyboard button switches the lower panel to playable keys. In standalone, TYPING plays from your computer keyboard, with Z/X choosing its octave.",
  "The standalone application remembers your sound, MIDI Learn and device choices between sessions.",
]
performance_improvements = []
bug_fixes = [
  "Audio and MIDI selectors follow device changes and keep the last good MIDI list if discovery fails.",
]

[[release]]
version = "0.2.4"
features = [
  "Choose LETTERING > LARGE in Settings for larger panel lettering, menus and tips in either look.",
  "Choose WINDOW > SIZE in Settings to set the window size or fit it to your screen.",
]
performance_improvements = []
bug_fixes = [
  "The resize grip is visible in both looks, with a DRAG TO RESIZE tip and resize arrows on Windows and Linux.",
  "Menus fit inside small windows.",
]

[[release]]
version = "0.2.5"
features = []
performance_improvements = [
  "New instances start at LO, 30 to 45 times lighter than HI. Existing projects keep their QUALITY setting; presets don't change it.",
]
bug_fixes = [
  "The pitch wheel now works in the Audio Unit, bending by MIDI BEND RANGE as the other formats do.",
  "The resize grip shows resize arrows on macOS too.",
]

[[release]]
version = "0.2.6"
features = [
  "The preset browser is easier to read, with clearer lettering, stronger contrast and the current preset marked in gold.",
]
performance_improvements = [
  "Same sound, lighter on your computer. Every preset and project renders bit-identical to 0.2.5.",
  "HI uses up to 17 % less CPU on a Mac and up to 9 % less on Windows and Linux when you play several voices.",
  "The panel does less work when you can't see it, saving CPU while your track plays. Audio Units keep drawing as before.",
  "An instance playing HI voices uses about a fifth of a core less on Mac while it waits for work.",
  "With six or more fast cores, ULTRA spreads each voice across several cores. It's still best for offline renders.",
]
bug_fixes = [
  "Several CA-72 instances play smoothly together, without the later ones stuttering, and computers with more cores put them to use.",
]

[[release]]
version = "0.2.7"
features = [
  "INIT in the preset drawer resets the sound to the fresh-instance patch; your settings stay as they are.",
  "ENTROPY reaches steady pitch at 0 %. 5 % sounds as the old 0 % did, and new instances start there.",
  "Earlier presets and projects move to the new ENTROPY scale automatically. Old automation uses the new scale.",
  "Settings shows the version you're running, and this note shows what changed after an update.",
  "Choose where the standalone app installs, an external drive included. Plug-ins stay where hosts look.",
]
performance_improvements = []
bug_fixes = [
  "Mac: on a non-Retina monitor beside a Retina screen, the panel fills its window instead of a corner.",
  "Mac: the app opens at its window's size on any screen instead of being cut off on the right.",
  "Windows: the app's window is exactly its panel at every display scale, with no black space.",
  "Linux: docks show the CA-72's own icon instead of a gear.",
  "CLAP: a note sent at velocity zero through CLAP's note events now plays.",
]

[[release]]
version = "0.2.8"
features = []
performance_improvements = []
bug_fixes = [
  "AUTO GAIN no longer moves the level a second after you change a preset or a knob; only DRIVE changes it.",
  "Presets play at their own AUTO GAIN level the moment you choose them.",
  "The standalone asks for the microphone only when you choose an external input, and keeps playing while it asks.",
  "An audio device that doesn't answer is named instead of leaving AUDIO & MIDI empty; MIDI keeps working.",
  "Mac: MIDI controllers plugged in while the app runs now appear.",
  "The standalone quits with Command-Q on a Mac and Ctrl+Q on Linux, saving your session.",
]

[[release]]
version = "0.3.0"
features = [
  "An arpeggiator: press ARP on the rail for ON, HOLD, DIRECTION, RATE, OCTAVES, GATE and SWING, in time with your host.",
  "HOLD with the arpeggiator off keeps your notes sounding as a drone until you play a new chord.",
  "MPE: each note's pressure, timbre and bend move its own voice; press MPE on the rail to set how far.",
  "GLIDE goes five times longer: right-click it and choose LONG.",
  "Oscillators 2 and 3 at LO can be timed: a key under RANGE locks the cycle to a note value of your host's tempo.",
  "Right-click a WAVEFORM switch and choose CONTINUOUS to sweep smoothly through every waveform to a narrow pulse, with a MOD key to modulate the shape.",
  "Standalone: press FX for four slots of your own CLAP and VST3 effects; one that crashes never stops the synth.",
  "Standalone: SETTINGS > AGENTS > ALLOW lets an AI agent play and set up the CA-72 through MCP, on this computer only.",
  "The Left and Right arrow keys, or MIDI pads you assign, choose the previous and next preset.",
  "Settings > MOD WHEEL SOURCE chooses the CC or aftertouch that moves the MOD wheel.",
  "Command-click (Ctrl-click on Windows and Linux) a knob to type an exact value.",
  "Skin packs: the editor's looks are now packs in one open format.",
]
performance_improvements = [
  "Much cleaner high notes in every QUALITY mode; ULTRA's VCA now runs at four times the sample rate.",
  "One latency in every QUALITY mode, so switching QUALITY never shifts your timing.",
  "QUALITY LO shares its voices with spare processor cores on Mac and Linux, and on Windows when the computer is busy.",
]
bug_fixes = [
  "Knobs move smoothly from the mouse, a trackpad and automation, in offline renders too; choosing a preset still changes the sound at once.",
  "Fewer dropouts in POLY with DOUBLE at QUALITY HI on a busy computer.",
  "Hosts that load the CA-72 on a smaller thread no longer crash.",
  "The Audio Unit no longer crashes when a host prepares it on a thread with a small stack.",
]
