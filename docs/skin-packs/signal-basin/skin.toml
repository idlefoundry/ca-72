[look]
base = "realistic"
layout = "layout.toml"
art = "art/panel.svg"
fonts = { regular = "fonts/BarlowCondensed-Medium.ttf", bold = "fonts/BarlowCondensed-SemiBold.ttf" }
# Each knob's line runs from its middle: the whole knob turns.
knob_caps = "turn"
# The strip under the panel: its bays and the signal's way into OUTPUT.
strip_art = "art/strip.svg"
# The keyboard view: its case teal as the bays, edged in copper.
keyboard_art = "art/keyboard.svg"
keyboard_case = "face"

# The strip's lamps a warm amber; the tabs' and keys' print cream, on black Bakelite.
[look.colours]
lamp = "#ffa040"
drops = "#ffa62a"
tab_print = "#e6dcc4"
key_print = "#e6dcc4"
wheel = "#d8c4a0"

