# SIGNAL BASIN, a skin pack for the CA-72: black panels in weathered teal, edged in copper, cream
# knobs, the signal's way drawn from each source into one copper bus. The format: docs/skin-packs.md.
# Dedicated to the public domain under CC0 1.0 (LICENSE.txt).

format = 1
id = "org.idlefoundry.signal-basin"
name = "SIGNAL BASIN"
version = "0.1.0"
plugin = "ca-72"
summary = "Weathered teal and copper: four rows of sources flowing into one copper bus, on a taller panel."
license = "CC0-1.0"
license_files = ["LICENSE.txt"]

