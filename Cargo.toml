[workspace]
resolver = "3"
# The plug-in hosting the standalone application borrows from the owner's DAW, DAW-v3
# (third_party/daw-v3/VENDORED.md): members, so that their own tests run here too.
members = ["crates/*", "xtask", "third_party/daw-v3/*"]
default-members = ["crates/*"]
exclude = [
    "third_party/AudioUnitSDK",
    "third_party/baseview",
    "third_party/clap",
    "third_party/clap-wrapper",
    "third_party/nih-plug",
    "third_party/softbuffer",
    "third_party/urw-gothic",
]

[workspace.package]
version = "0.2.6"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/idlefoundry/ca-72"

[workspace.dependencies]
ca72 = { path = "crates/ca72" }
ca72-analysis = { path = "crates/ca72-analysis" }
ca72-rt = { path = "crates/ca72-rt" }
ca72-spice = { path = "crates/ca72-spice" }
ca72-fx = { path = "crates/ca72-fx" }
# The plug-in hosting, from DAW-v3 (third_party/daw-v3): its transport, shared by the
# standalone and its helper, and the helper's host of CLAP and VST3 plug-ins.
daw-ipc = { path = "third_party/daw-v3/daw-ipc" }
daw-helper = { path = "third_party/daw-v3/daw-helper" }

# The plug-in framework (ISC; its VST3 bindings are GPL-3.0): its commit below with ten fixes,
# to state loading, buses, resizing, the processing mode, the host's null channels and the
# editor's edits while the host processes audio, and two additions for MIDI Learn, a parameter
# set from the audio thread and a context for tests (third_party/nih-plug/PATCHES.md).
nih_plug = { path = "third_party/nih-plug" }
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }

# The CLAP and VST3 bindings and the plug-ins' loading, in the effects' helper process
# only (docs/fx-host.md), as DAW-v3 takes them.
clap-sys = "0.5"
libc = "0.2"
libloading = "0.8"
libm = "0.2"
rtrb = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
tempfile = "3.27"
vst3 = "0.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

# The real-time models run seconds of audio in their tests (their calibrations among
# them): unoptimised, the debug suite takes hours.
[profile.dev.package.ca72]
opt-level = 3

[profile.dev.package.libm]
opt-level = 3

[profile.dev.package.ca72-analysis]
opt-level = 3

# The editor draws its panel in software: unoptimised, a frame takes seconds.
[profile.dev.package.resvg]
opt-level = 3

[profile.dev.package.usvg]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.tiny-skia-path]
opt-level = 3

[profile.release]
debug = 1

# The plug-in's bundles (`cargo xtask bundle ca72-plugin --profile bundle`): link-time
# optimised, about 3 % faster, the same samples (decisions.md R13). The tests and the
# measurements run by hand (`--release`) do without it: it links far slower.
[profile.bundle]
inherits = "release"
lto = "fat"
codegen-units = 1
