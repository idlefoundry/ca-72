# The CA-72's panel: where each control, legend, rule, title and fixture is.
#
# This is the official panel as layout data, in the skin packs' format (docs/skin-packs.md).
# The editor draws its panel from it; the plug-in's tests check that it draws the panel as
# approved. Copyright (C) 2026 Idle Foundry Ltd., GPL-3.0-or-later, as the rest of the CA-72.
# Starting a pack of your own? Start from the CC0 starter in docs/skin-packs/starter instead:
# this file is under the GPL, and a pack made from it is too.
#
# Units are the drawing's, the face's top left corner at 0, 0: x to the right (0 to 3108), y
# down (the face 0 to 795; the wooden strip above it -130 to 0). The controls' places are
# their centres. What each control is, and what its dial or legends read, is the plug-in's:
# a layout says where it is and how it looks.

format = 1

[fixtures]
# POWER's switch, its lamp and OVERLOAD's lamp: centres.
power = [3023, 580]
lamp = [3023, 426]
overload = [1764, 274]
# QUALITY's opening (ULTRA's lamp, LO's hamster): its centre.
ultra = [3023, 92]
# The name plate's top left corner (261 by 82).
plate = [2578, -106]
# The PHONES jack (it has no parameter: drawn dimmed): centre and radius.
phones = [2855, 581, 34]
# The wooden strip's screws: centre and radius.
screws = [[155.4, -22, 7], [1087.8, -22, 7], [2020.2, -22, 7], [2952.6, -22, 7]]

# The controls. `big`: a knob's larger size. `size`: a switch's or toggle's width and height.
# `colour`: a rocker's (blue, red, black, ivory). `on`: the end a rocker is pressed at to switch
# on (right, top, bottom). `across`: a toggle on its side.

