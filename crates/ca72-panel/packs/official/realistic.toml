# The CA-72's REALISTIC look as a skin pack, built into the plug-in (decisions.md R-SKIN-PACKS):
# the format every pack uses (docs/skin-packs.md). `cargo run -p ca72-panel --example
# export_pack -- realistic <folder>` writes it out as a folder.

format = 1
id = "com.idlefoundry.ca72.realistic"
name = "REALISTIC"
version = "1.0.0"
plugin = "ca-72"
summary = "The panel in pictures of the original's materials, gently used."
license = "GPL-3.0-or-later"
license_files = ["LICENSE.txt"]

[[creators]]
name = "Idle Foundry Ltd."
role = "layout, pictures and drawing"

[[assets]]
path = "layout.toml"
origin = "original"
author = "Idle Foundry Ltd."
note = "Measured from a photograph of the instrument, Wikimedia Commons' Minimoog panel.jpg (Alex Harden, cropped by Clusternote, CC BY 2.0), only looked at: the photograph is not included."

[[assets]]
path = "pictures/walnut.png"
origin = "generated"
author = "Idle Foundry Ltd."
tool = "OpenAI's image model through the Codex CLI 0.160.1, then cut out and adjusted with ImageMagick 7"
note = "Its prompt and every step after it: assets/worn/README.md in the CA-72's repository."

