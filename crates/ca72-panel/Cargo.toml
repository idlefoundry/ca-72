[package]
name = "ca72-panel"
description = "The CA-72's front panel, drawn: its art as SVG, rendered with resvg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
resvg = { version = "0.45", default-features = false, features = ["text"] }
# The worn skins' materials (plugin-kit's K5), from github.com/idlefoundry/plugin-kit at one
# commit (its `materials` branch until K5 is merged there).
plugin-kit-materials = { git = "https://github.com/idlefoundry/plugin-kit", rev = "43a51a7399f31f8ae3bf0994573bb7e9d88bbaab" }
rustybuzz = "0.20"

[lints]
workspace = true
