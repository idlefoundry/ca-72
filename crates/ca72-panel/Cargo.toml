[package]
name = "ca72-panel"
description = "The CA-72's front panel, drawn: its art as SVG, rendered with resvg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
resvg = { version = "0.45", default-features = false, features = ["text"] }
# The worn skins' materials (plugin-kit's K5), from github.com/idlefoundry/plugin-kit at the
# commit the plug-in takes its K6 and K7 at (the kit's `stereo-inner` branch until they are merged there).
plugin-kit-materials = { git = "https://github.com/idlefoundry/plugin-kit", rev = "eb374f84c4a901164d832f023525582dfbcd8ce5" }
rustybuzz = "0.20"

[lints]
workspace = true
