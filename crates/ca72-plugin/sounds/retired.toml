# The factory presets the plug-in no longer carries (decisions.md R55): 0.1's twenty-four, as
# 0.1.5 had them, translated as a session 0.1 saved is when it opens (decisions.md R-TRANSLATE,
# `examples/translate_0_1.rs`): each knob whose law the calibration changed moved to where it
# sets what it set, LEVEL -0.5 dB; Cruising Whistle's and Ladder Kick's CUTOFF as R42 retuned
# them, their filter's pitch kept, and Stacked Fifths a true fourth and fifth (R54). Never built
# into the plug-in: every release with one here carries them beside its installers as the user's
# presets to add to the library, `CA-72-<version>-0.1-presets.zip` (`scripts/package.sh`), so
# that a player of an earlier version keeps them. A session never needs them: it holds every
# value itself.
# ENTROPY uses the extended scale: 5 % is the former minimum (R-ENTROPY-FLOOR).
format = 1
version = "0.2.7"

