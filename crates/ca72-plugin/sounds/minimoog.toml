# The Minimoog's factory presets: DAW-v3's `minimoog` device and the CA-72 plug-in carry this
# same file (DMM-P; the plug-in's decisions R10). Each preset sets the panel as its dials
# print (a choice by its index: RANGE LO, 32', 16', 8', 4', 2' are 0 to 5; WAVEFORM triangle
# to narrow rectangle 0 to 5; a switch 0 off, 1 on); a control it does not name is at its
# default. `poly` (0 or 1) and `voices` are the DAW's POLY and VOICES. The PITCH wheel and
# QUALITY are never part of a preset.
#
# The fifteen after Bass and Lead are documented Model D patches under names of our own (DMM-P
# lists each one's source): Moog's own 1974 sound charts and the 2016 reissue's patch sheets,
# and two recreations by ear. Their MAIN OUTPUT VOLUME levels them against each other (measured
# on the model), not the charts' listening level.
format = 1

[[preset]]
name = "Bass"
description = "Two sawtooths at 16', a hair apart, through a closed, plucked filter."
tags = ["bass"]

[preset.values]
osc1_range = 2
osc2_on = 1
osc2_range = 2
osc2_frequency = 0.1
cutoff = -2.0
emphasis = 3.5
contour_amount = 3.5
filter_decay = 3.5
filter_sustain = 2.5
loudness_decay = 3.0
volume = 9.6

[[preset]]
name = "Lead"
description = "Two sawtooths at 4' with glide, the filter half open with some emphasis."
tags = ["lead", "glide"]

[preset.values]
osc1_range = 4
osc2_on = 1
osc2_range = 4
osc2_frequency = 0.08
cutoff = 0.0
emphasis = 4.0
contour_amount = 4.0
glide = 2.0
glide_on = 1
volume = 8.1

