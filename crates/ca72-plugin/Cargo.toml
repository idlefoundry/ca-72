[package]
name = "ca72-plugin"
description = "The CA-72 as a VST3 and CLAP plug-in"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
# A debug build that aborts when the audio thread allocates, for trying the plug-in in a
# host (nih-plug's own global allocator: the tests count with theirs instead).
assert_process_allocs = ["nih_plug/assert_process_allocs"]

[dependencies]
ca72.workspace = true
nih_plug.workspace = true

[dev-dependencies]
ca72-analysis.workspace = true

[lints]
workspace = true
