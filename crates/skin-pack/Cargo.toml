[package]
name = "skin-pack"
description = "Idle Foundry's skin packs: reading a pack's folder as untrusted input, its manifest, licence and provenance, and its pictures, SVG and fonts checked against limits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The plug-ins' resvg (its usvg and tiny-skia), for SVG's parsing and a timed test drawing.
resvg = { version = "0.45", default-features = false }
# usvg's own XML parser, to read an SVG strictly (no DTD) before usvg sees it.
roxmltree = "0.20"
# fontdb's and rustybuzz's font parser, to read a font's tables.
ttf-parser = "0.25"
png = "0.17"
serde = { workspace = true }
sha2 = "0.10"
toml = "0.7"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
