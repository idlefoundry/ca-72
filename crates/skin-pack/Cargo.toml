[package]
name = "skin-pack"
description = "Idle Foundry's skin packs: reading a pack's folder as untrusted input, its manifest, licence and provenance, and its pictures, SVG and fonts checked against limits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The plug-ins' resvg (its usvg and tiny-skia), for SVG's parsing and a timed test drawing.
# `raster-images` draws the PNGs a drawing embeds (with them it links JPEG, GIF and WebP
# decoders that a pack's drawing never reaches: `svg::options` hands resvg only PNG).
resvg = { version = "0.45", default-features = false, features = ["raster-images"] }
# usvg's own parser of `data:` URLs, to read a drawing's embedded pictures as usvg will.
data-url = "0.3"
# usvg's own XML parser, to read an SVG strictly (no DTD) before usvg sees it.
roxmltree = "0.20"
# fontdb's and rustybuzz's font parser, to read a font's tables.
ttf-parser = "0.25"
png = "0.17"
serde = { workspace = true }
# Marketplace packs' signatures, checked offline against the plug-in's keys.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
sha2 = "0.10"
toml = "0.7"
# A pack in one file: a ZIP archive, stored or deflated (nothing else read).
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
