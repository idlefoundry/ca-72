[package]
name = "ca72-fx-helper"
description = "The standalone application's effects' helper process: loads and runs CLAP and VST3 effects (DAW-v3's helper), so that the application itself never loads plug-in code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ca72-fx-helper"
path = "src/main.rs"

[dependencies]
daw-helper.workspace = true

# The chain's tests, here beside the helper they start (`CARGO_BIN_EXE_ca72-fx-helper`), with
# DAW-v3's test plug-ins, which cargo builds as libraries beside the test binaries.
[dev-dependencies]
ca72-plugin = { path = "../ca72-plugin", features = ["fx-host"] }
ca72-fx.workspace = true
daw-ipc.workspace = true
daw-test-plugin = { path = "../../third_party/daw-v3/daw-test-plugin" }
daw-test-vst3 = { path = "../../third_party/daw-v3/daw-test-vst3" }
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
