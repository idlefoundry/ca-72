[package]
name = "daw-helper"
description = "The plugin helper process: hosts CLAP plugins for the DAW over shared memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap-sys.workspace = true
daw-ipc.workspace = true
libloading.workspace = true
serde_json.workspace = true
vst3.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
daw-test-plugin = { path = "../daw-test-plugin" }
daw-test-vst3 = { path = "../daw-test-vst3" }

[lints]
workspace = true
